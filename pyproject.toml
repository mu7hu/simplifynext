[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "augury"
version = "0.1.0"
description = "Autonomous cross-channel marketing experimentation and budget allocation agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SimplifyNext Hackathon Team", email = "team@augury.ai" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-aws>=0.1.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto[dynamodb]>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
