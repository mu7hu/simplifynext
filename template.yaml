AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SimplifyNext Traction serverless application

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_DEFAULT_REGION: !Ref AWS::Region
        USE_STUB_MODELS: !Ref UseStubModels
        LEDGER_BACKEND: dynamodb
        STORAGE_BACKEND: s3
        DYNAMODB_LEDGER_TABLE: !Ref LedgerTable
        AWS_DATA_BUCKET: !Ref DataBucket
        MAX_AGENT_RETRIES: '2'
        MAX_GRAPH_ITERATIONS: '20'

Parameters:
  UseStubModels:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Keep true until the AWS infrastructure has passed end-to-end tests.

Resources:
  TractionApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
          - OPTIONS

  RunCycleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: traction-latest
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - traction.api.run_cycle_lambda.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LedgerTable
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        RunCycle:
          Type: HttpApi
          Properties:
            ApiId: !Ref TractionApi
            Path: /run-cycle
            Method: POST

  AnalystFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: traction-latest
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - traction.api.analyst_lambda.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        Analyst:
          Type: HttpApi
          Properties:
            ApiId: !Ref TractionApi
            Path: /analyst
            Method: POST

  ContentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: traction-latest
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
          - traction.api.content_lambda.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      Events:
        Content:
          Type: HttpApi
          Properties:
            ApiId: !Ref TractionApi
            Path: /content
            Method: POST

  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: startup_id
          AttributeType: S
        - AttributeName: entry_key
          AttributeType: S
      KeySchema:
        - AttributeName: startup_id
          KeyType: HASH
        - AttributeName: entry_key
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${TractionApi}.execute-api.${AWS::Region}.amazonaws.com'
  LedgerTableName:
    Value: !Ref LedgerTable
  DataBucketName:
    Value: !Ref DataBucket
